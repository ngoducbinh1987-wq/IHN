name: BMT MES – Deploy database

# Chạy tay: tab Actions → "BMT MES – Deploy database" → Run workflow
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cài psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Áp dụng migration lên Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bmt-mes/scripts/deploy_psql.sh
